syntax = "proto3";
package job;
service JobService {
  rpc GetJob (GetJobRequest) returns (JobResponse);
}
message GetJobRequest { int32 id = 1; }
message JobResponse {
  int32 id = 1;
  string title = 2;
  string company = 3;
  string location = 4;
  string type = 5;
  string stipend = 6;
  string description = 7;
  string skills = 8;
}
